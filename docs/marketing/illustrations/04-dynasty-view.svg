<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs><style>
    .ink-text { font-family: 'STKaiti', 'KaiTi', serif; fill: #1c1c1e; }
    .teal { fill: #2d5a6b; }
  </style></defs>
  <rect width="400" height="400" fill="#f7f5f0"/>
  <text x="200" y="50" text-anchor="middle" class="ink-text" font-size="20" font-weight="700">朝代视图</text>
  <text x="200" y="75" text-anchor="middle" class="ink-text" font-size="11" fill="#5c5c6e">从先秦到清代,一图看尽</text>
  <g transform="translate(50,120)">
    <rect width="60" height="30" rx="4" fill="#c9852b"/>
    <text x="30" y="20" text-anchor="middle" class="ink-text" fill="#fff" font-size="12">唐</text>
    <text x="30" y="50" text-anchor="middle" class="ink-text" font-size="11" fill="#5c5c6e">618-907</text>
  </g>
  <g transform="translate(140,120)">
    <rect width="60" height="30" rx="4" class="teal"/>
    <text x="30" y="20" text-anchor="middle" class="ink-text" fill="#fff" font-size="12">宋</text>
    <text x="30" y="50" text-anchor="middle" class="ink-text" font-size="11" fill="#5c5c6e">960-1279</text>
  </g>
  <g transform="translate(230,120)">
    <rect width="60" height="30" rx="4" fill="#7899a8"/>
    <text x="30" y="20" text-anchor="middle" class="ink-text" fill="#fff" font-size="12">元</text>
    <text x="30" y="50" text-anchor="middle" class="ink-text" font-size="11" fill="#5c5c6e">1271-1368</text>
  </g>
  <g transform="translate(320,120)">
    <rect width="60" height="30" rx="4" fill="#5a8a6a"/>
    <text x="30" y="20" text-anchor="middle" class="ink-text" fill="#fff" font-size="12">明</text>
    <text x="30" y="50" text-anchor="middle" class="ink-text" font-size="11" fill="#5c5c6e">1368-1644</text>
  </g>
  <g transform="translate(80,220)">
    <rect width="240" height="40" rx="6" fill="#efece4" stroke="#d8d4ce"/>
    <text x="120" y="25" text-anchor="middle" class="ink-text" font-size="13">唐诗 280+ 首</text>
  </g>
  <g transform="translate(80,270)">
    <rect width="240" height="40" rx="6" fill="#efece4" stroke="#d8d4ce"/>
    <text x="120" y="25" text-anchor="middle" class="ink-text" font-size="13">宋词 200+ 首</text>
  </g>
  <g transform="translate(80,320)">
    <rect width="240" height="40" rx="6" fill="#efece4" stroke="#d8d4ce"/>
    <text x="120" y="25" text-anchor="middle" class="ink-text" font-size="13">其他朝代 700+ 首</text>
  </g>
</svg>
